<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap">

<script src="supabase.js"></script>
<script src="qrcode.js"></script>
<style>
/* Layout TV: tabellone alto quanto lo schermo, colonna giocatori + banca a destra. Telefono: comandi personali in colonna. */
:root{
  --table:#0b1416; --frame:#123036; --felt:#14343a; --felt2:#1d4a50; --line:#0e2529;
  --cell:#f7f5ee; --cell2:#e6e3d8; --ink:#171c1b; --fg:#eef4f0; --muted:#9db3ad;
  --accent:#ffc23d; --accent-ink:#2a1a00; --danger:#ff5a5f; --ok:#3ad08f; --pink:#ff3d8b;
  --port:#1f3b63; --util:#6e3fd6;
  --display:'Jost','Futura','Century Gothic','Trebuchet MS',sans-serif;
  --body:'Jost','Futura','Century Gothic','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,.95vw,26px)}
html,body{height:100%}
body{background:radial-gradient(ellipse at 30% 20%,#13282c,var(--table) 70%);background-color:var(--table);color:var(--fg);font-family:var(--body);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px;overflow-x:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* ---------- TV ---------- */
.tv{display:flex;gap:1.1rem;height:100%;align-items:stretch;justify-content:center}
.board{width:min(calc(100vh - 24px),calc(100vw - 24px - 22rem));max-width:100%;aspect-ratio:1;flex:none;container-type:inline-size;align-self:center;
  display:grid;grid-template-columns:1.4fr repeat(9,1fr) 1.4fr;grid-template-rows:1.4fr repeat(9,1fr) 1.4fr;
  gap:.28cqw;background:var(--frame);padding:.5cqw;border-radius:1.4cqw;box-shadow:0 0 0 .3cqw #2c5a60,0 2cqw 6cqw rgba(0,0,0,.6)}
.side{flex:1;min-width:0;max-width:44rem;display:flex;flex-direction:column;gap:.7rem;overflow:auto}
.bwrap{flex:none;align-self:center;width:min(calc(100vh - 24px),calc(100vw - 24px - 22rem));max-width:100%;aspect-ratio:1;overflow:hidden;border-radius:18px;perspective:1700px;perspective-origin:50% 40%}
.bwrap .board{width:100%;transition:transform .9s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.board.cam{box-shadow:none}
.cell{transform-style:preserve-3d}
.board.cam .toks{transform:rotateX(-58deg);transform-origin:50% 72%}
.stand{display:none;position:absolute;gap:.3cqw;justify-content:center;align-items:flex-end;z-index:5;pointer-events:none;transform-origin:50% 100%}
.b .stand{left:0;right:0;bottom:54%}.t .stand{left:0;right:0;bottom:6%}.l .stand{left:62%;right:0;bottom:28%}.r .stand{left:0;right:62%;bottom:28%}
.board.cam .stand{display:flex;transform:rotateX(-72deg)}
.board.cam .houses{visibility:hidden}
.stand .hs{width:2.2cqw;height:2.2cqw;filter:drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.4))}.stand .ht{width:3.4cqw;height:2.5cqw;filter:drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.4))}
@media (max-width:900px){.tv{flex-direction:column;height:auto}.bwrap{width:100%}.side{max-width:none}}

.cell{background:var(--cell);color:var(--ink);position:relative;display:flex;overflow:visible;cursor:pointer;border-radius:.35cqw}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.cell.sel{box-shadow:0 0 0 .45cqw var(--accent);z-index:4}
.cell.hot{box-shadow:0 0 0 .45cqw #fff,0 0 2.5cqw .6cqw var(--accent);z-index:5}
.band{flex:none;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.b .band{height:46%;border-radius:.35cqw .35cqw 0 0}.t .band{height:46%;border-radius:0 0 .35cqw .35cqw}
.l .band{width:38%;border-radius:0 .35cqw .35cqw 0}.r .band{width:38%;border-radius:.35cqw 0 0 .35cqw}
.sky{position:absolute;inset:0;width:100%;height:100%}
.houses{position:relative;display:flex;gap:.2cqw;padding:.25cqw;z-index:1}
.l .houses,.r .houses{flex-direction:column}
.hs{width:1.35cqw;height:1.35cqw}.ht{width:2.2cqw;height:1.6cqw}
.cbody{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.3cqw;gap:.15cqw;text-align:center;border-radius:inherit}
.nm{font-weight:700;font-size:1.12cqw;line-height:1.05;text-transform:uppercase;letter-spacing:.02cqw}
.l .nm,.r .nm{font-size:1cqw}
.pr{font-size:1.05cqw;font-weight:700;font-variant-numeric:tabular-nums;color:#55605d}
.ico{width:3.4cqw;height:3.4cqw}
.mort .cbody,.mort .band{filter:grayscale(1) brightness(.85)}
.mort .cbody{background:repeating-linear-gradient(45deg,transparent 0 .6cqw,rgba(0,0,0,.08) .6cqw 1.2cqw)}
.owner{position:absolute;width:2.1cqw;height:2.1cqw;z-index:3;border-width:.2cqw!important}
.b .owner{bottom:-.4cqw;right:-.3cqw}.t .owner{top:-.4cqw;right:-.3cqw}.l .owner{left:-.4cqw;bottom:-.3cqw}.r .owner{right:-.4cqw;bottom:-.3cqw}
.c-sorte{background:linear-gradient(160deg,#ffe08a,#ffc23d)}
.c-notizie{background:linear-gradient(160deg,#a8f0e4,#4fc7b5)}
.c-tax{background:linear-gradient(160deg,#eceff1,#c7cdd2)}
.c-go{background:linear-gradient(135deg,#7ee0a2,#25a464)}
.c-jail{background:linear-gradient(135deg,#9aa5b1,#4b5563);color:#fff}
.c-free{background:linear-gradient(135deg,#ff7ac2,#9b1d6a);color:#fff}
.c-gojail{background:linear-gradient(135deg,#6ea8ff,#1d3fa8);color:#fff}
.c-jail .pr,.c-free .pr,.c-gojail .pr{color:#fff}
.corner .cbody{gap:.4cqw}
.corner .nm{font-family:var(--display);font-size:1.6cqw;text-transform:uppercase;letter-spacing:.05cqw}
.corner .ico{width:4.6cqw;height:4.6cqw}
.corner .pr{color:#1d2a27;font-size:1.1cqw}

.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.2cqw;pointer-events:none;z-index:6}
.av{border-radius:50%;background:var(--pc);border:.28cqw solid #fff;overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.5)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:78%;height:78%}
.toks .av{width:3.5cqw;height:3.5cqw}
.toks .av.me{width:4.6cqw;height:4.6cqw;border-color:var(--accent);border-width:.4cqw;box-shadow:0 0 0 .3cqw rgba(0,0,0,.4),0 0 1.8cqw .4cqw var(--accent)}
.pin{position:absolute;left:50%;top:-3.1cqw;transform:translateX(-50%);width:0;height:0;border-left:1.2cqw solid transparent;border-right:1.2cqw solid transparent;border-top:1.6cqw solid var(--accent);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.6));animation:bob .7s ease-in-out infinite alternate;z-index:7}
.hop{animation:hop .3s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-1.6cqw) scale(1.12)}100%{transform:translateY(0) scale(1)}}
@keyframes bob{to{transform:translate(-50%,-.6cqw)}}

/* centro del tabellone */
.center{grid-area:2/2/11/11;background:radial-gradient(circle at 50% 30%,var(--felt2),var(--felt) 72%);border-radius:.8cqw;padding:2cqw 2.6cqw;
  display:flex;flex-direction:column;gap:1.3cqw;font-size:1.9cqw;overflow:auto;cursor:default;position:relative}
.logo{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;font-size:13cqw;line-height:.88;letter-spacing:-.15cqw;color:var(--accent);opacity:.12;transform:rotate(-14deg);pointer-events:none;z-index:0;white-space:nowrap}
.center>*:not(.logo){position:relative;z-index:1}
.center::before{content:"";position:absolute;inset:0;background:url(sfondo.jpg) center 30%/cover no-repeat;opacity:.16;border-radius:inherit;pointer-events:none;z-index:0;filter:saturate(.9)}
.sub{text-align:center;font-size:1.6cqw;color:var(--muted);text-transform:uppercase;letter-spacing:.2cqw}
.hd{display:flex;align-items:center;gap:1.8cqw;background:rgba(0,0,0,.18);border-radius:1.2cqw;padding:1.2cqw 1.6cqw}
.hd .av{width:8.5cqw;height:8.5cqw;border-width:.5cqw}
.who{font-family:var(--display);font-weight:800;font-size:3.4cqw;line-height:1.05}
.cash{font-size:2.5cqw;font-weight:800;font-variant-numeric:tabular-nums}
.neg{color:var(--danger)}
.dice{margin-left:auto;display:flex;gap:1cqw}
.die{width:6cqw;height:6cqw;background:#fffdf7;border-radius:1.1cqw;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:.8cqw;box-shadow:0 .45cqw 0 #c4c0b2}
.die i{display:block;width:1.2cqw;height:1.2cqw;border-radius:50%;margin:auto}
.die i.on{background:#1b1b1b}
.die.q{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:3cqw;color:#9aa;grid-template-columns:1fr;grid-template-rows:1fr}
.msg{font-size:2.2cqw;line-height:1.3;text-wrap:pretty;font-weight:600}
.waiting{font-size:2cqw;color:var(--muted)}
.mid{display:flex;gap:1.6cqw;align-items:flex-start;flex-wrap:wrap}
.mid>*{flex:1 1 20cqw;min-width:0}
.mid:empty{display:none}
.card{background:var(--cell);color:var(--ink);border-radius:.9cqw;padding:1.2cqw 1.8cqw;border-top:1.1cqw solid var(--accent);font-size:1.8cqw;line-height:1.3}
.card b{display:block;font-family:var(--display);font-size:1.25cqw;text-transform:uppercase;letter-spacing:.15cqw;color:#6b5418}
.card.notizie{border-top-color:#3fb6a5}.card.notizie b{color:#1d5f55}
.acts{display:flex;flex-wrap:wrap;gap:.9cqw;align-items:center}
.btn{font-weight:800;font-size:1.8cqw;padding:.95cqw 1.9cqw;border-radius:.9cqw;border:0;background:#2a575d;color:var(--fg);cursor:pointer}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--danger);color:#fff}
.btn.sm{font-size:1.4cqw;padding:.6cqw 1.2cqw}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:1.3cqw;color:var(--muted)}
.hist{margin-top:auto;border-top:1px solid #2c5a60;padding-top:.8cqw;display:flex;flex-direction:column;gap:.3cqw;font-size:1.4cqw;color:var(--muted)}
.hist div:first-child{color:var(--fg)}
.pill{display:inline-block;background:rgba(0,0,0,.3);border-radius:99px;padding:.3cqw 1cqw;font-size:1.3cqw;font-weight:700;color:var(--accent)}
.offer{background:rgba(0,0,0,.25);border:.2cqw solid var(--accent);border-radius:.8cqw;padding:1cqw 1.3cqw;display:flex;flex-direction:column;gap:.7cqw}
.deed{display:flex;gap:1.4cqw;align-items:flex-start;flex-wrap:wrap}
.deedc{background:var(--cell);color:var(--ink);border-radius:.8cqw;overflow:hidden;font-size:1.35cqw;flex:1;min-width:0}
.deedc h3{margin:0;padding:.8cqw 1.2cqw;font-family:var(--display);font-size:1.9cqw;color:#fff;text-shadow:0 .1cqw .3cqw rgba(0,0,0,.45);display:flex;justify-content:space-between;align-items:baseline;gap:1cqw}
.deedc h3 small{font-family:var(--body);font-size:1cqw;text-transform:uppercase;letter-spacing:.12cqw}
.deedc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;color:inherit;font-size:inherit}
.deedc td{padding:.3cqw 1.2cqw;border-top:1px solid var(--cell2)}
.deedc td:last-child{text-align:right;font-weight:700}
.deedc tr.cur td{background:#ffe7a6}
.deedc p{margin:0;padding:.9cqw 1.2cqw;line-height:1.35}
.deeda{display:flex;flex-direction:column;gap:.7cqw}
.auc{display:flex;flex-direction:column;gap:.6cqw}
.arow{display:flex;align-items:center;gap:1cqw;flex-wrap:wrap;background:rgba(0,0,0,.2);padding:.6cqw 1cqw;border-radius:.7cqw}
.arow .av{width:3.4cqw;height:3.4cqw}
.arow.lead{outline:.25cqw solid var(--accent)}
.bigbid{font-family:var(--display);font-weight:800;font-size:3cqw;color:var(--accent);font-variant-numeric:tabular-nums}
.olist{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.olist .o{display:flex;align-items:center;gap:.8cqw;background:rgba(0,0,0,.2);border-radius:.9cqw;padding:.7cqw 1.1cqw}
.olist .av{width:5cqw;height:5cqw}

/* colonna giocatori */
.sideh{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.sideh h2{margin:0;font-family:var(--display);font-size:1.5rem;color:var(--accent)}
.pl{background:var(--felt);border:.15rem solid var(--line);border-radius:1rem;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.45rem}
.pl.on{border-color:var(--pc);box-shadow:0 0 0 .15rem var(--pc) inset,0 0 1.4rem -.2rem var(--pc)}
.pl.out{opacity:.35}
.plh{display:flex;align-items:center;gap:.8rem}
.plh .av{width:3.6rem;height:3.6rem;border-width:.2rem}
.pn{font-weight:800;font-size:1.35rem;line-height:1.1}
.pw{font-size:.85rem;color:var(--muted)}
.pm{margin-left:auto;font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:.2rem .55rem;border-radius:99px;background:#2a575d}
.tag.j{background:#1d3fa8;color:#d8e4ff}
.props{display:flex;flex-wrap:wrap;gap:.25rem}
.pc{width:1.4rem;height:1.8rem;border-radius:.25rem;border:0;cursor:pointer;padding:0;position:relative}
.pc.m{opacity:.3}
.pc span{position:absolute;inset:auto 0 .1rem 0;font-size:.65rem;font-weight:800;color:#111}
.bankc{display:flex;align-items:center;gap:.8rem;background:linear-gradient(135deg,#2a2410,#1a1608);border:.15rem solid #5a4a1a;border-radius:1rem;padding:.7rem .9rem}
.bankc .bico{width:3.6rem;height:3.6rem;border-radius:50%;background:#ffc23d;display:grid;place-items:center;flex:none}
.bankc .bico svg{width:62%;height:62%}
.side .btn{font-size:.95rem;padding:.55rem .9rem;border-radius:.6rem}
.sbar{display:flex;flex-wrap:wrap;gap:.5rem}
.banner{background:#4a2a10;color:#ffe2bf;border-radius:.7rem;padding:.6rem .8rem;font-size:.95rem}

/* finestre */
.ov{position:fixed;inset:0;background:rgba(3,8,9,.84);display:grid;place-items:center;z-index:60;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--felt);border:1px solid #2c5a60;border-radius:1.2rem;padding:1.6rem;width:min(64rem,100%);max-height:100%;overflow:auto;font-size:1.05rem;display:flex;flex-direction:column;gap:1rem}
.modal h2{margin:0;font-family:var(--display);font-size:2rem;color:var(--accent);line-height:1.05}
.modal .btn{font-size:1.05rem;padding:.7rem 1.2rem;border-radius:.6rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(17rem,100%),1fr));gap:1rem}
.opts{display:flex;flex-direction:column;gap:.35rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:.5rem;background:rgba(0,0,0,.22);cursor:pointer;border:2px solid transparent;text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:rgba(255,194,61,.12)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.sw{width:.8rem;height:1.3rem;border-radius:.2rem;flex:none}
.field{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
.field input,.tin{font:inherit;padding:.5rem .7rem;border-radius:.5rem;border:1px solid #2c5a60;background:#0c1d20;color:var(--fg)}
.field input{width:8rem}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(14rem,100%),1fr));gap:1rem}
.qr{background:rgba(0,0,0,.25);border-radius:.8rem;padding:.9rem;display:flex;flex-direction:column;gap:.5rem;align-items:center;text-align:center}
.qr .qrbox{background:#fff;padding:.4rem;border-radius:.4rem;width:11rem;height:11rem}
.qr .qrbox svg{width:100%;height:100%}
.qr code{font-size:.8rem;word-break:break-all;color:var(--muted);user-select:all}
.rank{display:flex;flex-direction:column;gap:.5rem}
.rank div{display:flex;gap:.8rem;align-items:center;font-size:1.25rem;background:rgba(0,0,0,.22);padding:.6rem .9rem;border-radius:.6rem}
.rank .av{width:2.6rem;height:2.6rem}
.rank b{margin-left:auto;font-variant-numeric:tabular-nums}
.rules{line-height:1.5;color:#d3e0db}

/* configurazione */
.setup{max-width:56rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem;padding-block:2vh}
.setup h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,5.5rem);color:var(--accent);line-height:.95;overflow-wrap:anywhere}
.setup p{margin:0;color:var(--muted);font-size:1.15rem;max-width:60ch}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem 1rem;align-items:center;background:var(--felt);padding:.9rem;border-radius:1rem}
.prow .av{width:4.5rem;height:4.5rem;grid-row:span 2}
.prow .tin{font-size:1.2rem;width:100%}
.prow .ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.cbtn{width:1.9rem;height:1.9rem;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cbtn.on{border-color:#fff}
.toks10{display:flex;gap:.3rem;flex-wrap:wrap}
.tkb{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid transparent;background:#2a575d;cursor:pointer;display:grid;place-items:center;padding:0}
.tkb svg{width:75%;height:75%}
.tkb.on{border-color:var(--accent);background:var(--pc)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.setup .btn,.phone .btn{font-size:1.05rem;padding:.75rem 1.2rem;border-radius:.7rem}
.mode{display:flex;gap:.6rem;flex-wrap:wrap}
.mode button{flex:1 1 14rem;text-align:left;background:var(--felt);border:2px solid #2c5a60;border-radius:1rem;padding:.9rem 1rem;cursor:pointer}
.mode button.on{border-color:var(--accent);background:rgba(255,194,61,.1)}
.mode b{display:block;font-size:1.15rem}
.mode span{color:var(--muted);font-size:.95rem}

/* telefono */
.phone{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;font-size:16px}
.phone .me{display:flex;align-items:center;gap:.9rem;background:var(--felt);border-radius:1rem;padding:.9rem;border:.15rem solid var(--pc)}
.phone .me .av{width:4.5rem;height:4.5rem;border-width:3px}

async function sbGet(){const {data,error}=await SB.from('games').select('state,rev').eq('id',ROOM).maybeSingle();if(error)throw error;return data||{state:null,rev:0}}
async function sbRefresh(){try{const r=await sbGet();netErr=false;

/* ---------- logica di gioco (lavora sullo stato X) ---------- */
let X=null;
const cur=()=>X.players[X.turn];
function ev(o){X.seq=(X.seq||0)+1;X.ev.push({n:X.seq,...o})}
function log(t){X.log.unshift(t);X.log.length=Math.min(X.log.length,30)}
const ownsAll=(pl,g)=>grp(g).every(s=>X.own[s.i]&&X.own[s.i].o===pl);
const countType=(t,pl)=>SQ.filter(x=>x.t===t&&X.own[x.i]&&X.own[x.i].o===pl).length;
const unm=i=>Math.round(SQ[i].mort*1.1);
function rent(i){const s=SQ[i],o=X.own[i];
 if(s.t==='prop'){if(o.lv)return s.r[o.lv];return ownsAll(o.o,s.g)?s.r[0]*2:s.r[0]}
 if(s.t==='port')return 25*2**(countType('port',o.o)-1);
 return (countType('util',o.o)===2?10:4)*(X.dice[0]+X.dice[1])}
function worth(st,j){let w=st.players[j].money;for(const[i,o]of Object.entries(st.own||{})){if(o.o!==j)continue;const s=SQ[i];w+=o.m?s.mort:s.p;if(o.lv)w+=o.lv*GROUPS[s.g].h}return w}
function pay(a,b,amt,why){if(!amt)return;X.players[a].money-=amt;if(b!=null)X.players[b].money+=amt;X.cred=b;ev({k:'pay',a,b,amt});
 if(b!=null&&amt>500)ev({k:'sweat',a,b});
 log(`${X.players[a].name} paga ${eur(amt)}${b!=null?' a '+X.players[b].name:''} (${why})`)}
function gain(a,amt,why){X.players[a].money+=amt;ev({k:'pay',a:null,b:a,amt});log(`${X.players[a].name} riceve ${eur(amt)} (${why})`)}
function stepTo(target){const p=cur(),path=[];let go=false;while(p.pos!==target){p.pos=(p.pos+1)%40;path.push(p.pos);if(p.pos===0)go=true}
 ev({k:'move',j:X.turn,path});if(go)gain(X.turn,200,'passaggio dalla Partenza')}
function stepBack(n){const p=cur(),path=[];for(let k=0;k<n;k++){p.pos=(p.pos+39)%40;path.push(p.pos)}ev({k:'move',j:X.turn,path})}
function toJail(){const p=cur();p.pos=10;p.jail=true;p.jt=0;X.again=false;X.dbl=0;ev({k:'jail',j:X.turn});log(p.name+' è stato beccato dagli sbirri: in carcere')}
function settle(){const p=cur();X.mult=1;X.utilX=0;
 if(p.money<0){X.phase='debt';X.msg=`${p.name} è in rosso di ${eur(-p.money)}. Vendi edifici, ipoteca o vendi proprietà agli altri con uno scambio. Altrimenti è bancarotta.`}
 else{X.phase=X.again?'roll':'end';if(X.again)X.msg+=' Doppio: lancia ancora!'}}
function doRoll(){
 if(X.phase!=='roll')return false;const p=cur();X.card=null;X.msg='';
 const d=[r6(),r6()],dbl=d[0]===d[1],sum=d[0]+d[1];X.dice=d;ev({k:'dice',d,j:X.turn});log(`${p.name} lancia ${d[0]} + ${d[1]}`);
 if(p.jail){
  if(dbl){p.jail=false;X.again=false;X.msg='Doppio! Esci dal carcere. ';stepTo((p.pos+sum)%40);return land()}
  p.jt++;
  if(p.jt>=3){p.jail=false;X.again=false;pay(X.turn,null,50,'cauzione');X.msg='Terzo tentativo fallito: paghi €50 di cauzione ed esci. ';stepTo((p.pos+sum)%40);return land()}
  X.again=false;X.msg=`Niente doppio. Resti in carcere (tentativo ${p.jt} di 3).`;return settle()}
 if(dbl){X.dbl++;if(X.dbl===3){X.msg='Tre doppi di fila: gli sbirri ti beccano!';toJail();return settle()}}else X.dbl=0;
 X.again=dbl;stepTo((p.pos+sum)%40);return land()}
function land(){
 const p=cur(),i=p.pos,s=SQ[i];
 if(s.t==='prop'||s.t==='port'||s.t==='util'){
  const o=X.own[i];
  if(!o){X.phase='buy';X.msg+=`${s.full} è libera. Costa ${eur(s.p)}: la compri o va all'asta?`;return}
  if(o.o===X.turn)X.msg+=`Sei a casa tua: ${s.full}.`;
  else if(o.m)X.msg+=`${s.full} è ipotecata: non paghi nulla.`;
  else{let r=rent(i);if(s.t==='port')r*=X.mult;if(s.t==='util'&&X.utilX)r=X.utilX*(X.dice[0]+X.dice[1]);
   pay(X.turn,o.o,r,'affitto di '+s.full);X.msg+=`${p.name} paga ${eur(r)} a ${X.players[o.o].name} per ${s.full}.`}}
 else if(s.t==='tax'){pay(X.turn,null,s.v,s.full);X.msg+=`${s.full}: paghi ${eur(s.v)}.`}
 else if(s.t==='sorte'||s.t==='notizie')return drawCard(s.t);
 else if(s.t==='gojail'){X.msg+='Ti hanno beccato gli sbirri e ti portano in carcere!';toJail()}

const manageOK=()=>X&&X.stage==='play'&&!X.winner&&['roll','end','debt','buy'].includes(X.phase);

function stripForHist(s){const c=clone(s);delete c.hist;delete c.ev;delete c.seq;delete c.rev;return c}
async function commit(fn,opts={}){
 if(pending&&!opts.queue)return;
 while(pending)await sleep(60);
 pending=true;UI.err='';setTimeout(render,0);
 try{
  for(let attempt=0;attempt<6;attempt++){
   let s;
   let base;
   if(MODE==='sb'){const r=await sbGet();s=clone(r.state);base=r.rev||0}
   else{if(MODE==='server'){const r=await api('api/state');s=(await r.json()).state}else s=clone(G);base=s?s.rev||0:0}
   const before=s&&s.stage==='play'&&s.phase!=='order'?stripForHist(s):null;
   X=s;let res=fn(s);X=null;
   if(res===false)return;
   if(res&&typeof res==='object')s=res;
   s.ev=(s.ev||[]).slice(-40);s.rev=base+1;
   if(before&&!opts.noHist)s.hist=(s.hist||[]).concat([before]).slice(-10);
   if(MODE==='sb'){const {data,error}=await SB.rpc('commit_state',{p_id:ROOM,p_base:base,p_state:s});if(error)throw error;if(!data){await sleep(80+Math.random()*200);continue}onGame(s);return}
   if(MODE==='server'){const r=await api('api/state',{base,state:s});if(r.status===409){await sleep(80+Math.random()*200);continue}if(!r.ok)throw new Error('server '+r.status);return}
   onGame(s);saveLocal();return}
  UI.err='Troppe mosse insieme: riprova.';
 }catch(e){UI.err='Collegamento non riuscito: controlla la connessione e riprova.'}
 finally{X=null;pending=false;render()}}

function typing(){if(ptrDown)return true;const a=document.activeElement;return !!(a&&a.tagName==='INPUT'&&(a.id.startsWith('p-name')||a.id==='ph-name'||a.id.startsWith('trade-')))}
function render(){

 if(lastShell!=='tv'){app.innerHTML='<main class="tv"><div class="bwrap"><div class="board" id="board"></div></div><aside class="side" id="side"></aside></main><div id="ov"></div>';lastShell='tv'}

 $('#side').innerHTML=sideHTML();
 const ov=G.winner&&!busyNow()?winnerHTML('host'):UI.draft?`<div class="ov"><div class="modal"><h2>Scambio: ${esc(G.players[UI.draft.from].name)} con ${esc(G.players[UI.draft.to].name)}</h2>${tradeDraft('host')}</div></div>`:UI.modal==='links'?linksModal():UI.modal==='rules'?rulesHTML():'';

const who=()=>isPhone()?myIdx():'host';
async function act(a,arg){
 if(!['bankrupt','newgame','finish'].includes(a)&&UI.confirm)UI.confirm=null;
 const w=who();
 switch(a){
  case 'create':if(MODE==='sb'){const r=(mkcode()+mkcode()).slice(0,6);history.replaceState(null,'','?r='+r);G=null;sbJoin(r)}return commit(()=>blankGame(),{noHist:true});
  case 'resumeroom':history.replaceState(null,'','?r='+arg);return sbJoin(arg);
  case 'lampo':return setupEdit(s=>{s.lampo=arg==='1'});
  case 'addp':return setupEdit(s=>{if(s.players.length<6)s.players.push(newPlayer(s.players.length,s.players))});
  case 'remp':return setupEdit(s=>{if(s.players.length>2)s.players.pop()});
  case 'color':{const[k,c]=arg.split(':');return setupEdit(s=>{s.players[+k].color=c})}
  case 'tok':{const[k,t]=arg.split(':');if(PHOTOS[G.players[+k].code])await removePhoto(G.players[+k].code);if(G.stage==='setup')return setupEdit(s=>{s.players[+k].token=+t});return}
  case 'nophoto':return removePhoto(arg);
  case 'start':return commit(s=>{if(!s||s.stage!=='setup')return false;startPlay(s)},{noHist:true,queue:true});
  case 'toggle3d':OPT3D=!OPT3D;try{localStorage.setItem('smarm-3d',OPT3D?'1':'0')}catch(e){}if(!OPT3D)cam(null,400);return render();
  case 'links':UI.modal='links';return render();
  case 'rules':UI.modal='rules';return render();
  case 'closemodal':UI.modal=null;return render();
  case 'fs':{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}return}
  case 'sel':if(isPhone())return;UI.sel=+arg;return render();
  case 'unsel':UI.sel=null;return render();
  case 'reveal':UI.reveal=arg;return render();
  case 'orderroll':case 'roll':case 'buy':case 'auction':case 'end':case 'payjail':case 'usefree':case 'cont':return doAct(w,a);
  case 'accept':case 'reject':UI.reveal=null;return doAct(w,a,arg);
  case 'build':case 'sell':case 'mort':case 'unmort':return doAct(w,a,+arg);
  case 'bid':{const[j,v]=arg.split(':');return doAct(w,'bid',+j,+v)}
  case 'wd':return doAct(w,'wd',+arg);
  case 'bankrupt':if(UI.confirm==='bankrupt'){UI.confirm=null;return doAct(w,'bankrupt')}UI.confirm='bankrupt';return render();
  case 'undo':return undo(w);
  case 'trade':UI.draft={from:w==='host'?G.turn:w,to:+arg,give:[],get:[],gm:0,tm:0};return render();
  case 'tg':{const[side,i]=arg.split(':');const L=UI.draft[side],n=+i,k=L.indexOf(n);k<0?L.push(n):L.splice(k,1);return render()}
  case 'tcancel':UI.draft=null;return render();
  case 'tsend':{const T=UI.draft,p=G.players[T.from],q=G.players[T.to];const gm=Math.max(0,Math.floor(+T.gm||0)),tm=Math.max(0,Math.floor(+T.tm||0));
   if(gm>Math.max(0,p.money)||tm>Math.max(0,q.money)){T.err='Qualcuno offre più soldi di quelli che ha.';return render()}
   if(!T.give.length&&!T.get.length&&!gm&&!tm){T.err='La proposta è vuota.';return render()}
   const o={from:T.from,to:T.to,give:T.give.slice(),get:T.get.slice(),gm,tm};UI.draft=null;return doAct(w,'offer',o)}
  case 'finish':if(UI.confirm==='finish'){UI.confirm=null;return doAct('host','finish')}UI.confirm='finish';return render();
  case 'resumeplay':return doAct('host','resumeplay');
  case 'newgame':if(UI.confirm!=='newgame'){UI.confirm='newgame';return render()}UI.confirm=null;// prosegue
  case 'newgame2':{UI.sel=null;queue=[];vis=null;animUntil=0;$('#fx').innerHTML='';return commit(s=>{const old=s&&s.players?s.players:[];const ng=blankGame();if(old.length)ng.players=old.map(p=>({code:p.code,name:p.name,color:p.color,token:p.token||0}));ng.lampo=!!(s&&s.lampo);ng.seq=s?s.seq||0:0;return ng},{noHist:true})}
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg)});
document.addEventListener('input',e=>{const t=e.target;if(UI.draft){if(t.id==='trade-gm')UI.draft.gm=t.value;if(t.id==='trade-tm')UI.draft.tm=t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.photo&&t.files&&t.files[0])return savePhoto(t.dataset.photo,t.files[0]);
 if(t.dataset&&t.dataset.k!=null&&G&&G.stage==='setup'){const k=+t.dataset.k,v=t.value.slice(0,16);G.players[k].name=v;setupEdit(s=>{if(s.players[k])s.players[k].name=v})}});
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'){if(e.key==='Enter')e.target.blur();return}
 if(e.code==='Space'||e.code==='Enter'){const b=document.querySelector('[data-primary]');if(b&&!b.disabled&&!UI.draft&&!UI.modal){e.preventDefault();b.click()}}
 if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!isPhone()){e.preventDefault();undo('host')}});
window.addEventListener('hashchange',()=>{lastShell='';render()});

/* ---------- avvio ---------- */
function connect(){
 const es=new EventSource('api/stream');
 es.addEventListener('state',e=>{if(netErr){netErr=false}try{onGame(JSON.parse(e.data).state)}catch(err){}});
 es.addEventListener('photos',e=>{try{PHOTOS=JSON.parse(e.data)||{}}catch(err){}render()});
 es.onopen=()=>{if(netErr){netErr=false;render()}};
 es.onerror=()=>{if(!netErr){netErr=true;render()}}}
async function boot(){
 if(window.SMARM&&SMARM.url&&SMARM.key&&window.supabase){try{SB=supabase.createClient(SMARM.url,SMARM.key);MODE='sb'}catch(e){SB=null}}
 if(MODE==='sb'){const r=roomFromURL();if(r)sbJoin(r);render();return}
 if(location.protocol.startsWith('http')){try{const r=await fetch('api/info',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.app==='smarmellatopoly'){INFO=j;MODE='server'}}}catch(e){}}
 if(MODE==='server'){connect();render();return}
 const g=loadLocal();if(g){G=g;lastSeq=g.seq||0}render()}
boot();
})();
</script>
